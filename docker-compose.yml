services:
  postgres:
    image: postgres:16-alpine
    container_name: fretego-postgres
    environment:
      POSTGRES_DB: fretego
      POSTGRES_USER: fretego
      POSTGRES_PASSWORD: fretego123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretego -d fretego"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretego-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fretego
      DB_USER: fretego
      DB_PASSWORD: fretego123
      MENSAGERIA_API_BASE_URL: http://host.docker.internal:8082
      MENSAGERIA_WEBSOCKET_PATH: /ws-fretes
      MENSAGERIA_WEBSOCKET_TOPIC: /topic/fretes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"

volumes:
  postgres_data:
